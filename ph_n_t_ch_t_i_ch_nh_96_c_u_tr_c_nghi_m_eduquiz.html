<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Phân Tích Tài Chính HĐKD - EduQuiz</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        eduGreen: '#10B981',
                        eduRed: '#EF4444',
                        eduBlue: '#2563EB',
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .dark .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col font-sans transition-colors duration-200">

    <!-- Header -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo & Title -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-600 flex items-center justify-center text-white font-bold text-xl shadow-md">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold bg-gradient-to-r from-emerald-600 to-teal-600 dark:from-emerald-400 dark:to-teal-400 bg-clip-text text-transparent">
                            EduQuiz - Phân Tích Tài Chính
                        </h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">96 Câu Trắc Nghiệm Ngành QTKD (2 TC)</p>
                    </div>
                </div>

                <!-- Global Actions -->
                <div class="flex items-center space-x-2 sm:space-x-4">
                    <!-- Mode Toggle -->
                    <div class="hidden md:flex items-center bg-slate-100 dark:bg-slate-700 p-1 rounded-lg">
                        <button id="modePractice" onclick="setMode('practice')" class="px-3 py-1.5 text-xs font-semibold rounded-md transition-all shadow-sm bg-white dark:bg-slate-800 text-emerald-600 dark:text-emerald-400">
                            <i class="fa-solid fa-book-open mr-1"></i> Ôn Tập Tức Thì
                        </button>
                        <button id="modeExam" onclick="setMode('exam')" class="px-3 py-1.5 text-xs font-semibold rounded-md text-slate-600 dark:text-slate-300 hover:text-slate-900 transition-all">
                            <i class="fa-solid fa-clock mr-1"></i> Thi Thử
                        </button>
                    </div>

                    <!-- Theme Toggle -->
                    <button onclick="toggleDarkMode()" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-700 transition">
                        <i class="fa-solid fa-moon dark:hidden text-lg"></i>
                        <i class="fa-solid fa-sun hidden dark:inline text-lg text-amber-400"></i>
                    </button>

                    <!-- Mobile Menu Button -->
                    <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Left Column: Quiz Engine -->
        <div class="lg:col-span-8 flex flex-col space-y-6">

            <!-- Stats Bar -->
            <div class="grid grid-cols-4 gap-3 bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                <div class="text-center border-r border-slate-100 dark:border-slate-700 pr-2">
                    <span class="text-xs text-slate-500 dark:text-slate-400 uppercase font-medium">Tổng số</span>
                    <p class="text-lg sm:text-xl font-bold text-slate-800 dark:text-slate-100" id="statTotal">96</p>
                </div>
                <div class="text-center border-r border-slate-100 dark:border-slate-700 pr-2">
                    <span class="text-xs text-emerald-600 dark:text-emerald-400 uppercase font-medium">Đúng</span>
                    <p class="text-lg sm:text-xl font-bold text-emerald-600 dark:text-emerald-400" id="statCorrect">0</p>
                </div>
                <div class="text-center border-r border-slate-100 dark:border-slate-700 pr-2">
                    <span class="text-xs text-rose-600 dark:text-rose-400 uppercase font-medium">Sai</span>
                    <p class="text-lg sm:text-xl font-bold text-rose-600 dark:text-rose-400" id="statWrong">0</p>
                </div>
                <div class="text-center">
                    <span class="text-xs text-slate-500 dark:text-slate-400 uppercase font-medium">Tiến độ</span>
                    <p class="text-lg sm:text-xl font-bold text-blue-600 dark:text-blue-400" id="statProgress">0%</p>
                </div>
            </div>

            <!-- Question Card -->
            <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-md p-6 flex-1 flex flex-col justify-between relative transition-all">
                
                <!-- Question Header -->
                <div>
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center space-x-2">
                            <span class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300" id="questionCategory">
                                Câu 1 / 96
                            </span>
                            <span class="px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300" id="questionGroup">
                                Nhóm A
                            </span>
                        </div>
                        <button onclick="toggleBookmarkCurrent()" id="btnBookmark" class="text-slate-300 hover:text-amber-400 dark:text-slate-600 dark:hover:text-amber-400 text-xl transition">
                            <i class="fa-solid fa-bookmark"></i>
                        </button>
                    </div>

                    <!-- Question Text -->
                    <h2 class="text-base sm:text-lg font-semibold text-slate-900 dark:text-slate-100 mb-6 leading-relaxed" id="questionText">
                        Đang tải câu hỏi...
                    </h2>

                    <!-- Options Container -->
                    <div class="space-y-3" id="optionsContainer">
                        <!-- Options injected by JS -->
                    </div>
                </div>

                <!-- Question Footer / Controls -->
                <div class="pt-6 mt-6 border-t border-slate-100 dark:border-slate-700 flex flex-wrap justify-between items-center gap-3">
                    <button onclick="prevQuestion()" id="btnPrev" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-sm font-medium transition flex items-center">
                        <i class="fa-solid fa-arrow-left mr-2"></i> Câu trước
                    </button>

                    <div class="flex items-center space-x-2">
                        <button onclick="resetCurrentQuestion()" class="px-3 py-2 text-xs font-medium text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 transition">
                            <i class="fa-solid fa-rotate-right mr-1"></i> Làm lại
                        </button>
                        <button onclick="nextQuestion()" id="btnNext" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold shadow-md transition flex items-center">
                            Câu tiếp <i class="fa-solid fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Submit Exam Button (Visible in Exam mode) -->
            <div id="examSubmitContainer" class="hidden">
                <button onclick="submitExam()" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold rounded-2xl shadow-lg hover:from-blue-700 hover:to-indigo-700 transition">
                    <i class="fa-solid fa-paper-plane mr-2"></i> Nộp Bài Thi
                </button>
            </div>

        </div>

        <!-- Right Column: Question Navigator & Filters -->
        <div id="sidebar" class="lg:col-span-4 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-5 shadow-sm flex flex-col max-h-[calc(100vh-120px)]">
            
            <!-- Filter Bar -->
            <div class="mb-4 space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-slate-800 dark:text-slate-200 text-sm">Danh sách câu hỏi</h3>
                    <button onclick="resetAll()" class="text-xs text-rose-500 hover:underline">
                        <i class="fa-solid fa-trash-can mr-1"></i> Xóa làm lại
                    </button>
                </div>

                <!-- Filter Tabs -->
                <div class="grid grid-cols-3 gap-1 bg-slate-100 dark:bg-slate-700 p-1 rounded-xl text-xs font-medium">
                    <button onclick="setFilter('all')" id="filterAll" class="py-1.5 rounded-lg bg-white dark:bg-slate-800 shadow-xs text-emerald-600 dark:text-emerald-400 font-bold">
                        Tất cả (96)
                    </button>
                    <button onclick="setFilter('groupA')" id="filterA" class="py-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:text-slate-900">
                        Nhóm A (58)
                    </button>
                    <button onclick="setFilter('groupB')" id="filterB" class="py-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:text-slate-900">
                        Nhóm B (38)
                    </button>
                </div>

                <!-- Sub-filters -->
                <div class="flex space-x-2 text-xs">
                    <button onclick="setFilter('wrong')" id="filterWrong" class="px-2.5 py-1 rounded-lg border border-rose-200 text-rose-600 hover:bg-rose-50 dark:border-rose-900 dark:text-rose-400 dark:hover:bg-rose-950 transition">
                        <i class="fa-solid fa-xmark mr-1"></i> Sai
                    </button>
                    <button onclick="setFilter('unanswered')" id="filterUnanswered" class="px-2.5 py-1 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-700 transition">
                        <i class="fa-regular fa-circle mr-1"></i> Chưa làm
                    </button>
                    <button onclick="setFilter('bookmarked')" id="filterBookmarked" class="px-2.5 py-1 rounded-lg border border-amber-200 text-amber-600 hover:bg-amber-50 dark:border-amber-900 dark:text-amber-400 dark:hover:bg-amber-950 transition">
                        <i class="fa-solid fa-bookmark mr-1"></i> Đã lưu
                    </button>
                </div>
            </div>

            <!-- Grid Matrix -->
            <div class="flex-1 overflow-y-auto custom-scrollbar pr-1">
                <div class="grid grid-cols-6 sm:grid-cols-8 lg:grid-cols-6 gap-2" id="gridMatrix">
                    <!-- Buttons generated by JS -->
                </div>
            </div>

            <!-- Legend -->
            <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-700 grid grid-cols-3 gap-2 text-[11px] text-slate-500 dark:text-slate-400">
                <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-emerald-500 mr-1.5"></span> Đúng</div>
                <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-rose-500 mr-1.5"></span> Sai</div>
                <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-slate-200 dark:bg-slate-700 mr-1.5"></span> Chưa làm</div>
            </div>

        </div>

    </main>

    <!-- Quiz Data & Script -->
    <script>
        // Full Question Bank (96 Questions matched with User's Answer Key)
        const rawQuestions = [
            // NHÓM A (1-58)
            { id: 1, q: "Nhiệm vụ nào sau đây không phải là nhiệm vụ của phân tích tài chính doanh nghiệp?", options: ["Phản ánh, ghi chép các nghiệp vụ kinh tế phát sinh", "Đánh giá các hiện tượng, kết quả kinh tế", "Xác định, chỉ rõ các nguyên nhân và tính các nhân tố ảnh hưởng", "Đề xuất, kiến nghị các giải pháp"], ans: 0, group: "A" },
            { id: 2, q: "Phương pháp phân tích TCDN nào sau đây xác định mức độ ảnh hưởng của từng nhân tố đến kết quả kinh tế?", options: ["Phương pháp phân chia", "Phương pháp thay thế liên hoàn", "Phương pháp so sánh", "Phương pháp đồ thị, đồ biểu."], ans: 1, group: "A" },
            { id: 3, q: "Phương pháp phân tích TCDN nào sau đây không xác định mức độ ảnh hưởng của từng nhân tố đến kết quả kinh tế?", options: ["Phương pháp thay thế liên hoàn", "Phương pháp so sánh", "Phương pháp số chênh lệch", "Phương pháp cân đối."], ans: 1, group: "A" },
            { id: 4, q: "Giai đoạn nào sau đây không thuộc giai đoạn của phân tích tài chính?", options: ["Giai đoạn lập kế hoạch phân tích", "Giai đoạn sưu tầm tài liệu", "Giai đoạn thực hiện phân tích", "Giai đoạn phát hiện các sai sót."], ans: 3, group: "A" },
            { id: 5, q: "Chức năng nào sau đây không thuộc chức năng của phân tích tài chính doanh nghiệp?", options: ["Chức năng đánh giá", "Chức năng dự báo", "Chức năng điều chỉnh", "Chức năng phân phối"], ans: 3, group: "A" },
            { id: 6, q: "Giải pháp nào dưới đây được áp dụng để tăng ROA?", options: ["Tăng sử dụng nợ vay", "Tăng hiệu suất sử dụng tài sản", "Thay đổi kết cấu mặt hàng sản xuất", "Tăng cường vốn chủ sở hữu"], ans: 1, group: "A" },
            { id: 7, q: "Giải pháp nào dưới đây được áp dụng để tăng ROE?", options: ["Thay đổi kết cấu mặt hàng sản xuất", "Điều chỉnh chất lượng sản phẩm", "Điều chỉnh mức hạ giá thành đơn vị sản phẩm", "Điều chỉnh cơ cấu nguồn vốn giữa tỷ lệ nợ vay và vốn chủ sở hữu"], ans: 3, group: "A" },
            { id: 8, q: "Chi phí nguyên vật liệu trực tiếp trong giá thành sản xuất sản phẩm chịu tác động của nhân tố nào sau đây?", options: ["Mức hao hụt về vật liệu nhập kho.", "Giá vật liệu xuất dùng", "Năng suất lao động của công nhân sản xuất trực tiếp", "Số lượng công nhân sản xuất"], ans: 1, group: "A" },
            { id: 9, q: "Chi phí quản lý doanh nghiệp chịu sự tác động của nhân tố nào dưới đây?", options: ["Chi phí khấu hao cửa hàng, quầy hàng", "Chi phí về tiền lương của bộ phận kế toán", "Chi phí dịch vụ mua ngoài phục vụ cho sản xuất", "Chi phí quảng cáo hàng bán"], ans: 1, group: "A" },
            { id: 10, q: "Trong nội dung phân tích kết quả hoạt động kinh doanh, cần thiết phải phân tích nội dung chủ yếu nào sau đây?", options: ["Phân tích lợi nhuận của từng mặt hàng", "Phân tích lợi nhuận bán hàng và cung cấp dịch vụ", "Phân tích kết cấu mặt hàng sản xuất", "Phân tích kết cấu chi phí"], ans: 1, group: "A" },
            { id: 11, q: "Nhân tố nào dưới đây không tác động trực tiếp đến tổng lợi nhuận trước thuế?", options: ["Doanh thu bán hàng và cung cấp dịch vụ", "Chi phí tài chính", "Tỷ suất chi phí", "Giá vốn của hàng xuất bán"], ans: 2, group: "A" },
            { id: 12, q: "Tổng lợi nhuận thuần từ hoạt động kinh doanh không chịu tác động trực tiếp của nhân tố nào dưới đây?", options: ["Giá vốn của hàng xuất bán", "Chi phí bán hàng", "Chi phí quản lý doanh nghiệp", "Chi phí khác"], ans: 3, group: "A" },
            { id: 13, q: "Nhân tố nào dưới đây không tác động trực tiếp đến tổng số lợi nhuận thuần từ hoạt động kinh doanh?", options: ["Doanh thu hoạt động tài chính", "Doanh thu thuần", "Thu nhập khác", "Doanh thu bán hàng và cung cấp dịch vụ"], ans: 2, group: "A" },
            { id: 14, q: "Lợi nhuận thuần từ hoạt động kinh doanh chịu sự tác động chủ yếu của nhân tố nào dưới đây?", options: ["Thu nhập khác và chi phí khác", "Thu nhập khác", "Giá vốn của hàng xuất bán", "Chi phí khác"], ans: 2, group: "A" },
            { id: 15, q: "Lợi nhuận bán hàng chịu sự tác động chủ yếu của nhân tố nào dưới đây?", options: ["Doanh thu thuần từ bán hàng và cung cấp dịch vụ", "Doanh thu hoạt động tài chính", "Thu nhập khác", "Chi phí tài chính"], ans: 0, group: "A" },
            { id: 16, q: "Nhân tố nào dưới đây không tác động trực tiếp đến lợi nhuận bán hàng?", options: ["Doanh thu thuần từ bán hàng và cung cấp dịch vụ", "Doanh thu hoạt động tài chính", "Giá vốn của hàng xuất bán", "Chi phí bán hàng phân bổ cho hàng xuất bán."], ans: 1, group: "A" },
            { id: 17, q: "Chi phí nhân công trực tiếp trong giá thành sản xuất sản phẩm chịu tác động của nhân tố nào sau đây?", options: ["Năng suất lao động của công nhân sản xuất trực tiếp", "Giá vật liệu mua vào", "Mức hao hụt về vật liệu nhập kho", "Giá trị phế liệu thải loại"], ans: 0, group: "A" },
            { id: 18, q: "Xét về mức độ ảnh hưởng, nhân tố mức tiêu hao về vật liệu ảnh hưởng như thế nào đến khoản chi vật liệu trong giá thành sản xuất sản phẩm?", options: ["Ảnh hưởng thuận chiều", "Ảnh hưởng nghịch chiều", "Ảnh hưởng tỉ lệ thuận", "Ảnh hưởng tỉ lệ nghịch."], ans: 0, group: "A" },
            { id: 19, q: "Xét về mức độ, nhân tố giá vật liệu xuất dùng ảnh hưởng như thế nào đến khoản chi vật liệu trong giá thành sản xuất sản phẩm?", options: ["Ảnh hưởng thuận chiều", "Ảnh hưởng nghịch chiều", "Ảnh hưởng tỉ lệ thuận", "Ảnh hưởng tỉ lệ nghịch"], ans: 0, group: "A" },
            { id: 20, q: "Biện pháp quan trọng nào sau đây để giảm được mức tiêu hao nguyên vật liệu?", options: ["Cải tiến mẫu mã sản phẩm.", "Giảm giá vật liệu mua vào.", "Sử dụng vật liệu rẻ tiền để thay thế", "Giảm mức hao hụt vật liệu trong khi thu mua vật liệu"], ans: 0, group: "A" },
            { id: 21, q: "Nhân tố nào sau đây ảnh hưởng đến chi phí bán hàng?", options: ["Chi phí trích lập dự phòng nợ phải thu khó đòi", "Chi phí về hoa hồng môi giới hàng bán", "Tiền thuế môn bài", "Chi phí khấu hao TSCĐ phục vụ quản lý doanh nghiệp"], ans: 1, group: "A" },

        // State variables
        let appState = {
            currentIndex: 0,
            answers: {}, // { questionId: selectedOptionIndex }
            bookmarks: new Set(),
            mode: 'practice', // 'practice' or 'exam'
            filter: 'all', // 'all', 'groupA', 'groupB', 'wrong', 'unanswered', 'bookmarked'
            examSubmitted: false
        };

        // DOM Elements
        const questionText = document.getElementById('questionText');
        const questionCategory = document.getElementById('questionCategory');
        const questionGroup = document.getElementById('questionGroup');
        const optionsContainer = document.getElementById('optionsContainer');
        const gridMatrix = document.getElementById('gridMatrix');
        const btnBookmark = document.getElementById('btnBookmark');

        // Stats elements
        const statCorrect = document.getElementById('statCorrect');
        const statWrong = document.getElementById('statWrong');
        const statProgress = document.getElementById('statProgress');

        // Initialize App
        function initApp() {
            // Load bookmarks from local storage
            const savedBookmarks = localStorage.getItem('eduquiz_bookmarks');
            if (savedBookmarks) {
                appState.bookmarks = new Set(JSON.parse(savedBookmarks));
            }
            renderGrid();
            loadQuestion(appState.currentIndex);
            updateStats();
        }

        // Get filtered questions array
        function getFilteredQuestions() {
            return rawQuestions.filter(q => {
                if (appState.filter === 'groupA') return q.group === 'A';
                if (appState.filter === 'groupB') return q.group === 'B';
                if (appState.filter === 'wrong') return appState.answers[q.id] !== undefined && appState.answers[q.id] !== q.ans;
                if (appState.filter === 'unanswered') return appState.answers[q.id] === undefined;
                if (appState.filter === 'bookmarked') return appState.bookmarks.has(q.id);
                return true;
            });
        }

        // Load Question to UI
        function loadQuestion(index) {
            const filtered = getFilteredQuestions();
            if (filtered.length === 0) {
                questionText.innerText = "Không có câu hỏi nào khớp với bộ lọc!";
                optionsContainer.innerHTML = "";
                questionCategory.innerText = "0 / 0";
                return;
            }

            if (index < 0) index = 0;
            if (index >= filtered.length) index = filtered.length - 1;
            appState.currentIndex = index;

            const q = filtered[index];
            questionCategory.innerText = `Câu ${q.id} / 96`;
            questionGroup.innerText = `Nhóm ${q.group} - ${q.group === 'A' ? 'Trung bình' : 'Khó'}`;
            questionText.innerText = q.q;

            // Bookmark status
            if (appState.bookmarks.has(q.id)) {
                btnBookmark.className = "text-amber-400 text-xl transition";
            } else {
                btnBookmark.className = "text-slate-300 hover:text-amber-400 dark:text-slate-600 dark:hover:text-amber-400 text-xl transition";
            }

            // Render Options
            optionsContainer.innerHTML = "";
            const selectedOpt = appState.answers[q.id];
            const isAnswered = selectedOpt !== undefined;

            const optionPrefixes = ["A", "B", "C", "D"];

            q.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border transition-all duration-200 flex items-start space-x-3 group relative cursor-pointer ";
                
                // Styling based on state and mode
                if (appState.mode === 'practice' && isAnswered) {
                    if (optIdx === q.ans) {
                        // Correct option ALWAYS GREEN if answered
                        btn.className += "bg-emerald-50 border-emerald-500 text-emerald-900 dark:bg-emerald-950/60 dark:border-emerald-500 dark:text-emerald-200 font-medium shadow-xs";
                    } else if (optIdx === selectedOpt && selectedOpt !== q.ans) {
                        // Wrong option selected -> RED
                        btn.className += "bg-rose-50 border-rose-500 text-rose-900 dark:bg-rose-950/60 dark:border-rose-500 dark:text-rose-200 font-medium shadow-xs";
                    } else {
                        // Normal unselected option
                        btn.className += "border-slate-200 dark:border-slate-700 opacity-60 text-slate-500 dark:text-slate-400";
                    }
                } else if (appState.mode === 'exam' && appState.examSubmitted) {
                    if (optIdx === q.ans) {
                        btn.className += "bg-emerald-50 border-emerald-500 text-emerald-900 dark:bg-emerald-950/60 dark:border-emerald-500 dark:text-emerald-200 font-medium";
                    } else if (optIdx === selectedOpt && selectedOpt !== q.ans) {
                        btn.className += "bg-rose-50 border-rose-500 text-rose-900 dark:bg-rose-950/60 dark:border-rose-500 dark:text-rose-200 font-medium";
                    } else {
                        btn.className += "border-slate-200 dark:border-slate-700 opacity-60";
                    }
                } else if (isAnswered && optIdx === selectedOpt) {
                    // Selected state in exam mode (before submit)
                    btn.className += "bg-blue-50 border-blue-500 text-blue-900 dark:bg-blue-950/60 dark:border-blue-500 dark:text-blue-200 font-medium";
                } else {
                    // Default State
                    btn.className += "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:border-emerald-400 hover:bg-slate-50 dark:hover:bg-slate-750 text-slate-700 dark:text-slate-200";
                }

                // Click event
                btn.onclick = () => selectOption(q.id, optIdx);

                // Option Badge (A, B, C, D)
                let badgeClass = "w-7 h-7 rounded-lg text-xs font-bold flex items-center justify-center shrink-0 transition-colors ";
                if (appState.mode === 'practice' && isAnswered) {
                    if (optIdx === q.ans) badgeClass += "bg-emerald-500 text-white";
                    else if (optIdx === selectedOpt && selectedOpt !== q.ans) badgeClass += "bg-rose-500 text-white";
                    else badgeClass += "bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400";
                } else if (isAnswered && optIdx === selectedOpt) {
                    badgeClass += "bg-blue-600 text-white";
                } else {
                    badgeClass += "bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 group-hover:bg-emerald-500 group-hover:text-white";
                }

                // Icon status
                let statusIcon = "";
                if (appState.mode === 'practice' && isAnswered) {
                    if (optIdx === q.ans) statusIcon = `<i class="fa-solid fa-circle-check text-emerald-500 text-lg ml-auto"></i>`;
                    else if (optIdx === selectedOpt && selectedOpt !== q.ans) statusIcon = `<i class="fa-solid fa-circle-xmark text-rose-500 text-lg ml-auto"></i>`;
                }

                btn.innerHTML = `
                    <span class="${badgeClass}">${optionPrefixes[optIdx]}</span>
                    <span class="text-sm pt-0.5 leading-snug flex-1">${optText}</span>
                    ${statusIcon}
                `;

                optionsContainer.appendChild(btn);
            });

            renderGrid();
        }

        // Handle option selection
        function selectOption(qId, optIdx) {
            if (appState.mode === 'exam' && appState.examSubmitted) return;
            
            appState.answers[qId] = optIdx;
            loadQuestion(appState.currentIndex);
            updateStats();
        }

        // Navigation
        function nextQuestion() {
            const filtered = getFilteredQuestions();
            if (appState.currentIndex < filtered.length - 1) {
                loadQuestion(appState.currentIndex + 1);
            }
        }

        function prevQuestion() {
            if (appState.currentIndex > 0) {
                loadQuestion(appState.currentIndex - 1);
            }
        }

        function resetCurrentQuestion() {
            const filtered = getFilteredQuestions();
            if (filtered.length > 0) {
                const qId = filtered[appState.currentIndex].id;
                delete appState.answers[qId];
                loadQuestion(appState.currentIndex);
                updateStats();
            }
        }

        function resetAll() {
            if (confirm("Bạn có chắc chắn muốn xóa toàn bộ kết quả đã làm?")) {
                appState.answers = {};
                appState.examSubmitted = false;
                loadQuestion(0);
                updateStats();
            }
        }

        // Render Matrix Grid Buttons
        function renderGrid() {
            gridMatrix.innerHTML = "";
            const filtered = getFilteredQuestions();

            filtered.forEach((q, idx) => {
                const btn = document.createElement('button');
                const isSelected = idx === appState.currentIndex;
                const userAns = appState.answers[q.id];
                const isAnswered = userAns !== undefined;

                let btnClass = "w-full aspect-square rounded-xl text-xs font-bold transition-all duration-150 flex items-center justify-center relative shadow-2xs ";

                if (isSelected) {
                    btnClass += "ring-2 ring-blue-500 ring-offset-2 dark:ring-offset-slate-800 scale-105 z-10 ";
                }

                if (appState.mode === 'practice' && isAnswered) {
                    if (userAns === q.ans) {
                        btnClass += "bg-emerald-500 text-white shadow-emerald-200 dark:shadow-none";
                    } else {
                        btnClass += "bg-rose-500 text-white shadow-rose-200 dark:shadow-none";
                    }
                } else if (isAnswered) {
                    btnClass += "bg-blue-600 text-white";
                } else {
                    btnClass += "bg-slate-100 dark:bg-slate-700/70 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-300";
                }

                btn.className = btnClass;
                btn.innerText = q.id;

                // Bookmark Indicator Dot
                if (appState.bookmarks.has(q.id)) {
                    const dot = document.createElement('span');
                    dot.className = "absolute -top-1 -right-1 w-2.5 h-2.5 bg-amber-400 rounded-full border-2 border-white dark:border-slate-800";
                    btn.appendChild(dot);
                }

                btn.onclick = () => loadQuestion(idx);
                gridMatrix.appendChild(btn);
            });
        }

        // Bookmark Toggle
        function toggleBookmarkCurrent() {
            const filtered = getFilteredQuestions();
            if (filtered.length === 0) return;
            const qId = filtered[appState.currentIndex].id;

            if (appState.bookmarks.has(qId)) {
                appState.bookmarks.delete(qId);
            } else {
                appState.bookmarks.add(qId);
            }
            localStorage.setItem('eduquiz_bookmarks', JSON.stringify([...appState.bookmarks]));
            loadQuestion(appState.currentIndex);
        }

        // Stats Calculation
        function updateStats() {
            let correctCount = 0;
            let wrongCount = 0;
            const total = rawQuestions.length;

            Object.keys(appState.answers).forEach(qId => {
                const q = rawQuestions.find(item => item.id == qId);
                if (q) {
                    if (appState.answers[qId] === q.ans) correctCount++;
                    else wrongCount++;
                }
            });

            const answeredCount = Object.keys(appState.answers).length;
            const progressPct = Math.round((answeredCount / total) * 100);

            statCorrect.innerText = correctCount;
            statWrong.innerText = wrongCount;
            statProgress.innerText = `${progressPct}%`;
        }

        // Set App Mode
        function setMode(mode) {
            appState.mode = mode;
            const practiceBtn = document.getElementById('modePractice');
            const examBtn = document.getElementById('modeExam');
            const examSubmitContainer = document.getElementById('examSubmitContainer');

            if (mode === 'practice') {
                practiceBtn.className = "px-3 py-1.5 text-xs font-semibold rounded-md transition-all shadow-sm bg-white dark:bg-slate-800 text-emerald-600 dark:text-emerald-400";
                examBtn.className = "px-3 py-1.5 text-xs font-semibold rounded-md text-slate-600 dark:text-slate-300 hover:text-slate-900 transition-all";
                examSubmitContainer.classList.add('hidden');
            } else {
                examBtn.className = "px-3 py-1.5 text-xs font-semibold rounded-md transition-all shadow-sm bg-white dark:bg-slate-800 text-blue-600 dark:text-blue-400";
                practiceBtn.className = "px-3 py-1.5 text-xs font-semibold rounded-md text-slate-600 dark:text-slate-300 hover:text-slate-900 transition-all";
                examSubmitContainer.classList.remove('hidden');
            }
            loadQuestion(appState.currentIndex);
        }

        // Submit Exam
        function submitExam() {
            appState.examSubmitted = true;
            updateStats();
            loadQuestion(appState.currentIndex);
            alert(`Nộp bài thành công!\nSố câu đúng: ${statCorrect.innerText} / 96`);
        }

        // Set Filter
        function setFilter(filterType) {
            appState.filter = filterType;
            
            // Update Tab active UI
            ['All', 'A', 'B'].forEach(type => {
                const btn = document.getElementById(`filter${type}`);
                if (btn) {
                    if (filterType.toLowerCase().includes(type.toLowerCase())) {
                        btn.className = "py-1.5 rounded-lg bg-white dark:bg-slate-800 shadow-xs text-emerald-600 dark:text-emerald-400 font-bold";
                    } else {
                        btn.className = "py-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:text-slate-900";
                    }
                }
            });

            loadQuestion(0);
        }

        // Sidebar Toggle (Mobile)
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
        }

        // Dark Mode Toggle
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        // Start App
        window.onload = initApp;
    </script>
</body>
</html>
